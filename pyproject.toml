[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-deepresearcher-showcase"
version = "0.1.0"
description = "Evidence-bound scientific research agents with scoped authority, local DAGs and parallel explanation assessment"
requires-python = ">=3.12"
dependencies = [
  "langchain==1.3.18", "langchain-core==1.6.0",
  "langchain-deepseek==1.1.0", "langchain-openai==1.6.0",
  "langgraph==1.2.11", "langgraph-checkpoint-sqlite==3.1.1",
  "diptest==0.11.0", "numpy>=1.26", "scipy>=1.12", "pandas>=2.2",
  "duckdb>=1.2,<2", "rapidfuzz>=3", "scikit-learn>=1.4", "statsmodels>=0.14",
  "ruptures>=1.1.9", "pyproj>=3.6", "shapely>=2", "geopandas>=0.14",
  "pydantic>=2", "jsonschema>=4", "openpyxl>=3.1"
]

[project.optional-dependencies]
plates = ["pygplates>=1", "gplately>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["thin_epistemic_research_agent", "mix_epistemic_research_agent", "fixed_u_epistemic_research_agent", "scientific_infrastructure"]

[tool.setuptools.packages.find]
where = ["src"]
